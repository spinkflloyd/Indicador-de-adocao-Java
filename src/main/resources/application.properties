spring.application.name=adocao
server.port=${PORT:8080}
server.error.include-message=always

# PostgreSQL: em produção, configure JDBC_DATABASE_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/adocao}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Atualiza as tabelas sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Chave obrigatória para as rotas administrativas e para consultar os interesses.
adocao.chave-admin=${ADOCAO_CHAVE:}

# Limite de imagem para anúncios públicos (2 MB; a página já reduz a foto antes de enviar).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Anúncios públicos.
# Moderação: com true, todo anúncio novo fica PENDENTE até ser aprovado em /admin.html.
adocao.moderacao=${ADOCAO_MODERACAO:false}
# Limites de publicação por hora (por visitante e no total).
adocao.anuncios.max-por-ip-hora=${ADOCAO_MAX_ANUNCIOS_IP:3}
adocao.anuncios.max-global-hora=${ADOCAO_MAX_ANUNCIOS_GLOBAL:30}
