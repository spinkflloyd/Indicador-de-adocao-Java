<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anunciar animal para adoção</title><style>
:root{font-family:system-ui,sans-serif;color:#14262b;background:#eaf1f0}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:850px;margin:auto}a{color:#0b6b63}form{background:white;border:1px solid #c6d5d2;border-radius:14px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}label{display:grid;gap:6px;font-weight:600}input,select,textarea{font:inherit;padding:10px;border:1px solid #b8c9c5;border-radius:8px;width:100%}.wide{grid-column:1/-1}button{background:#0b6b63;color:white;border:0;border-radius:8px;padding:13px 18px;font-weight:700;cursor:pointer}.hint{color:#52666a;font-size:.9rem}.msg{padding:12px;border-radius:8px}.erro{background:#f9e2df;color:#8b2118}.ok{background:#d8eee8;color:#07554e}
</style></head><body><main class="wrap"><p><a href="/">← Voltar ao site</a></p><h1>Anunciar um animal para adoção</h1><p>Preencha as informações e envie uma foto. O anúncio será publicado automaticamente após o envio.</p><form id="form">
<label>Nome do animal<input name="nome" maxlength="80" required></label><label>Espécie<select name="especie" required><option value="">Selecione</option><option value="cachorro">Cachorro</option><option value="gato">Gato</option><option value="coelho">Coelho</option></select></label>
<label>Raça<input name="raca" maxlength="100" placeholder="Ex.: SRD (sem raça definida)" required></label><label>Porte<select name="porte"><option value="pequeno">Pequeno</option><option value="medio">Médio</option><option value="grande">Grande</option></select></label>
<label>Idade<select name="faixaEtaria"><option value="filhote">Filhote</option><option value="adulto">Adulto</option><option value="idoso">Idoso</option></select></label><label>Nível de energia<select name="energia"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option></select></label>
<label><span>Convive bem com crianças?</span><select name="sociavelCriancas"><option value="true">Sim</option><option value="false">Não / não informado</option></select></label><label><span>Convive bem com outros animais?</span><select name="sociavelAnimais"><option value="true">Sim</option><option value="false">Não / não informado</option></select></label>
<label>Está vacinado?<select name="vacinado"><option value="true">Sim</option><option value="false">Não</option></select></label><label>É hipoalergênico?<select name="hipoalergenico"><option value="false">Não / não sei</option><option value="true">Sim</option></select></label>
<label class="wide">Descrição<textarea name="descricao" maxlength="1200" rows="4" required placeholder="Conte a personalidade, cuidados, saúde e outras informações importantes."></textarea></label>
<label>Nome do responsável<input name="responsavel" maxlength="80" required></label><label>WhatsApp com DDD<input name="whatsapp" type="tel" maxlength="20" placeholder="(87) 99999-9999" required></label><label>Cidade/UF<input name="cidade" maxlength="100" placeholder="Salgueiro - PE" required></label>
<label class="wide">Foto do animal (JPG, PNG ou WEBP; até 5 MB)<input name="foto" type="file" accept="image/jpeg,image/png,image/webp" required><span class="hint">Envie uma foto nítida do animal. A imagem será armazenada junto ao anúncio.</span></label>
<div class="wide"><button type="submit">Publicar anúncio</button><p id="mensagem" role="status"></p></div></form></main><script>
const form=document.getElementById('form'),msg=document.getElementById('mensagem');form.addEventListener('submit',async e=>{e.preventDefault();msg.className='';msg.textContent='Enviando anúncio...';const dados=new FormData(form);try{const r=await fetch('/api/anuncios',{method:'POST',body:dados});const corpo=await r.json().catch(()=>({}));if(!r.ok)throw new Error(corpo.message||corpo.error||'Não foi possível publicar. Confira os campos e tente novamente.');msg.className='msg ok';msg.textContent='Anúncio publicado! Você já pode encontrá-lo na página inicial.';form.reset();}catch(err){msg.className='msg erro';msg.textContent=err.message;}});
</script></body></html>
