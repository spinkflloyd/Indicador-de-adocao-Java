<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicação de animais para adoção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#EAF1F0; --tinta:#14262B; --suave:#4C6166; --verde:#0B6B63; --verde-escuro:#084A45;
  --etiqueta:#F2B53B; --recusa:#B5412C; --linha:#C6D5D2; --branco:#FFFFFF;
  --fonte:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 1rem/1.5 var(--fonte)}
.pagina{max-width:980px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.intro{margin:0 0 24px;max-width:58ch;color:var(--suave)}
h2{font-size:1.25rem;margin:0 0 12px}

nav[role=tablist]{display:flex;flex-wrap:wrap;gap:4px 20px;border-bottom:2px solid var(--linha);margin-bottom:24px}
nav button{font:600 .95rem var(--fonte);color:var(--suave);background:none;border:0;padding:10px 0;margin-bottom:-2px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--verde-escuro);border-bottom-color:var(--etiqueta)}
nav button:hover{color:var(--tinta)}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}

form.painel{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 20px;align-items:end}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
select{font:400 1rem var(--fonte);padding:9px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--branco);color:var(--tinta)}
button.acao{font:600 1rem var(--fonte);background:var(--verde);color:#fff;border:0;border-radius:8px;padding:11px 20px;cursor:pointer}
button.acao:hover{background:var(--verde-escuro)}
.acoes{grid-column:1/-1}

.msg{margin:24px 0 14px;font-weight:600}
.erro{color:var(--recusa);font-weight:600;margin:16px 0}
.vazio{color:var(--suave)}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tag{background:var(--branco);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.tag header{background:var(--etiqueta);padding:28px 16px 12px;position:relative}
.tag header::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--fundo);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.tag h3{margin:0;font-size:1.6rem;font-weight:800;text-transform:capitalize;letter-spacing:-.01em}
.tag .sub{margin:0;font-size:.9rem}
.tag .corpo{padding:12px 16px 16px}
.tag ul{list-style:none;margin:0;padding:0}
.tag .fatos{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px;font-size:.9rem;color:var(--suave)}
.tag .sinais li{font-size:.9rem;padding:1px 0}
.sinais li::before{display:inline-block;width:1.3em;font-weight:800}
.sinais li.ok{color:var(--verde-escuro)} .sinais li.ok::before{content:"✓"}
.sinais li.nao{color:var(--recusa)} .sinais li.nao::before{content:"✗"}

.perfil{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.perfil h3{margin:0 0 4px;font-size:1.3rem;text-transform:capitalize}
.perfil p{margin:4px 0}
.perfil .rotulo{color:var(--suave)}

.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.resposta{background:var(--branco);border:1px solid var(--linha);border-left:6px solid var(--verde);border-radius:10px;padding:14px 18px;margin-top:20px}
.resposta.recusa{border-left-color:var(--recusa)}
.resposta ul{margin:8px 0 0;padding-left:20px}
.exemplo{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.exemplo h3{font-size:1rem;margin:0 0 6px}
.exemplo p{margin:2px 0}

.sec{margin-top:36px}
.analises{margin-top:8px}
.analise{background:var(--branco);border:1px solid var(--linha);border-radius:12px;margin-bottom:8px}
.analise.indicado{border-color:var(--verde)}
.analise summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px;cursor:pointer;list-style:none}
.analise summary::-webkit-details-marker{display:none}
.analise summary::before{content:"▸";color:var(--suave)}
.analise[open] summary::before{content:"▾"}
.analise summary strong{font-size:1.1rem;text-transform:capitalize}
.analise .quem{color:var(--suave);font-size:.9rem}
.selo{font-size:.85rem;font-weight:600;padding:2px 10px;border-radius:999px;margin-left:auto}
.selo.ok{background:#D5EEEA;color:var(--verde-escuro)}
.selo.nao{background:#F6DDD7;color:var(--recusa)}
.regras{list-style:none;margin:0;padding:4px 16px 14px}
.regras li{padding:6px 0;border-top:1px solid var(--linha)}
.regras li::before{display:inline-block;width:1.4em;font-weight:800}
.regras li.ok::before{content:"✓";color:var(--verde-escuro)}
.regras li.nao::before{content:"✗";color:var(--recusa)}
.regras li.nao{color:var(--recusa)}
.regras strong{margin-right:6px}

.texto{max-width:68ch;color:var(--suave);margin:0 0 20px}
.regras-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.regra{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px 18px}
.regra .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--etiqueta);font-weight:800;margin-bottom:8px}
.regra h3{margin:0 0 6px;font-size:1.1rem}
.regra p{margin:0 0 8px}
.regra .ex{font-size:.92rem;color:var(--suave);border-left:3px solid var(--etiqueta);padding-left:10px;margin:0}
.tabela-wrap{overflow-x:auto}
table.niveis{border-collapse:collapse;background:var(--branco);border:1px solid var(--linha);border-radius:10px;overflow:hidden}
table.niveis th,table.niveis td{padding:9px 16px;text-align:left;border-bottom:1px solid var(--linha)}
table.niveis th{background:var(--fundo);font-size:.9rem}
.final{background:var(--branco);border:1px solid var(--linha);border-left:6px solid var(--verde);border-radius:10px;padding:14px 18px;margin-top:28px}
</style>
</head>
<body>
<main class="pagina">
  <h1>Indicação de animais para adoção</h1>
  <p class="intro">Conte como é a sua casa e a sua rotina. O sistema indica os animais do abrigo que combinam com você e explica por que um animal não foi indicado.</p>

  <nav role="tablist" aria-label="Seções">
    <button role="tab" data-alvo="buscar" aria-selected="true">Buscar um animal</button>
    <button role="tab" data-alvo="comofunciona" aria-selected="false">Como funciona</button>
    <button role="tab" data-alvo="abrigo" aria-selected="false">Animais do abrigo</button>
    <button role="tab" data-alvo="perfis" aria-selected="false">Perfis cadastrados</button>
    <button role="tab" data-alvo="destaques" aria-selected="false">Prioridade e saúde</button>
    <button role="tab" data-alvo="explicar" aria-selected="false">Por que não?</button>
    <button role="tab" data-alvo="exemplos" aria-selected="false">Exemplos</button>
  </nav>

  <section id="buscar"></section>
  <section id="comofunciona" hidden></section>
  <section id="abrigo" hidden></section>
  <section id="perfis" hidden></section>
  <section id="destaques" hidden></section>
  <section id="explicar" hidden></section>
  <section id="exemplos" hidden></section>
</main>

<script>
// ---------- utilitários ----------
function h(tag, props, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const f of filhos.flat()) {
    if (f == null) continue;
    e.append(f.nodeType ? f : document.createTextNode(f));
  }
  return e;
}
const bonito = s => String(s).replaceAll('_', ' ');
const lista = nomes => nomes.length ? nomes.join(', ') : 'ninguém';

async function api(url, opcoes) {
  const r = await fetch(url, opcoes);
  if (!r.ok) {
    let msg = 'Erro ' + r.status;
    try { msg = (await r.json()).message || msg; } catch (_) {}
    throw new Error(msg);
  }
  return r.json();
}
function erro(e) { return h('p', { class: 'erro', role: 'alert' }, e.message); }

// ---------- cartão do animal (etiqueta de coleira) ----------
function sinal(ok, sim, nao) { return h('li', { class: ok ? 'ok' : 'nao' }, ok ? sim : nao); }
function cartao(a) {
  return h('article', { class: 'tag' },
    h('header', {}, h('h3', {}, a.nome), h('p', { class: 'sub' }, `${a.especie}, ${bonito(a.raca)}`)),
    h('div', { class: 'corpo' },
      h('ul', { class: 'fatos' },
        h('li', {}, `porte ${a.porte}`), h('li', {}, a.faixaEtaria), h('li', {}, `energia ${a.energia}`)),
      h('ul', { class: 'sinais' },
        sinal(a.vacinado, 'vacinado', 'não vacinado'),
        sinal(a.sociavelCriancas, 'convive bem com crianças', 'não convive com crianças'),
        sinal(a.sociavelAnimais, 'convive bem com outros animais', 'não convive com outros animais'),
        a.hipoalergenico ? sinal(true, 'hipoalergênico') : null)));
}
const grade = animais => h('div', { class: 'grade' }, animais.map(cartao));

// ---------- campos de formulário ----------
function campo(rotulo, nome, opcoes) {
  return h('label', {}, rotulo,
    h('select', { name: nome }, opcoes.map(([v, t]) => h('option', { value: v }, t))));
}
const SIM_NAO = [['nao', 'Não'], ['sim', 'Sim']];

// ---------- Buscar um animal ----------
function montarBuscar(alvo) {
  const resultado = h('div', { 'aria-live': 'polite' });
  const racaSelect = h('select', { name: 'raca' }, h('option', { value: 'qualquer' }, 'Sem preferência'));
  const especieCampo = campo('Que animal você procura?', 'especie',
    [['qualquer', 'Qualquer um'], ['cachorro', 'Cachorro'], ['gato', 'Gato'], ['coelho', 'Coelho']]);

  async function carregarRacas() {
    const esp = especieCampo.querySelector('select').value;
    try {
      const racas = await api('/api/racas' + (esp === 'qualquer' ? '' : '?especie=' + esp));
      racaSelect.replaceChildren(h('option', { value: 'qualquer' }, 'Sem preferência'),
        ...racas.map(r => h('option', { value: r }, bonito(r))));
    } catch (e) { resultado.replaceChildren(erro(e)); }
  }
  especieCampo.querySelector('select').addEventListener('change', carregarRacas);

  const form = h('form', { class: 'painel' },
    especieCampo,
    h('label', {}, 'Tem preferência de raça?', racaSelect),
    campo('Onde você mora?', 'moradia', [['apartamento', 'Apartamento'],
      ['casa_pequena', 'Casa pequena (sem quintal)'], ['casa_quintal', 'Casa com quintal']]),
    campo('Mora com crianças?', 'criancas', SIM_NAO),
    campo('Mora com outros animais?', 'animais', SIM_NAO),
    campo('Quanto tempo livre você tem para o animal?', 'tempo',
      [['pouco', 'Pouco'], ['medio', 'Médio'], ['muito', 'Muito']]),
    campo('Alguém em casa tem alergia a pelos?', 'alergia', SIM_NAO),
    campo('Você já teve animais antes?', 'experiencia',
      [['sim', 'Sim, já tive'], ['nao', 'Não, seria o primeiro']]),
    h('div', { class: 'acoes' }, h('button', { class: 'acao', type: 'submit' }, 'Ver animais indicados')));

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    const corpo = {
      especie: d.especie, raca: d.raca, moradia: d.moradia,
      criancas: d.criancas === 'sim', animais: d.animais === 'sim', tempo: d.tempo,
      alergico: d.alergia === 'sim', iniciante: d.experiencia === 'nao'
    };
    try {
      const pedido = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) };
      const [r, analise] = await Promise.all([api('/api/buscar', pedido), api('/api/checklist', pedido)]);
      const texto = {
        INDICADOS: 'Animais indicados para você:',
        SO_COMPATIVEIS: 'Nenhum animal com essa espécie ou raça é compatível com o seu perfil. Mas estes outros combinam com você:',
        NENHUM: 'Nenhum animal do abrigo é compatível com o seu perfil no momento.'
      }[r.situacao];
      resultado.replaceChildren(
        h('p', { class: 'msg' }, texto),
        r.animais.length ? grade(r.animais) : null,
        h('h2', { class: 'sec' }, 'Análise de todos os animais'),
        h('p', { class: 'texto' }, 'Clique em um animal para ver como ele se saiu em cada uma das 7 regras com o seu perfil.'),
        painelAnalise(analise));
    } catch (e) { resultado.replaceChildren(erro(e)); }
  });

  alvo.append(form, resultado);
  carregarRacas();
}

// ---------- checklist de regras por animal ----------
const maiuscula = s => s.charAt(0).toUpperCase() + s.slice(1);

function painelAnalise(lista) {
  const ordenada = [...lista].sort((x, y) => Number(y.recomendado) - Number(x.recomendado));
  return h('div', { class: 'analises' }, ordenada.map(x => {
    const falhas = x.verificacoes.filter(v => !v.ok).length;
    const veredito = x.recomendado
      ? 'indicado'
      : `não indicado (${falhas} ${falhas === 1 ? 'regra falhou' : 'regras falharam'})`;
    return h('details', { class: 'analise' + (x.recomendado ? ' indicado' : '') },
      h('summary', {},
        h('strong', {}, x.animal.nome),
        h('span', { class: 'quem' }, `${x.animal.especie}, ${bonito(x.animal.raca)}`),
        h('span', { class: 'selo ' + (x.recomendado ? 'ok' : 'nao') }, veredito)),
      h('ul', { class: 'regras' }, x.verificacoes.map(v =>
        h('li', { class: v.ok ? 'ok' : 'nao' }, h('strong', {}, v.regra), maiuscula(v.detalhe)))));
  }));
}

// ---------- Como funciona ----------
function montarComoFunciona(alvo) {
  const regras = [
    ['Espaço', 'O nível da moradia precisa ser maior ou igual ao nível de porte do animal.',
      'Rex é de porte grande (nível 3) e o apartamento da Ana é nível 1. Como 1 é menor que 3, ele não cabe.'],
    ['Tempo livre', 'O nível de tempo livre da pessoa precisa ser maior ou igual ao nível de energia do animal.',
      'Mel tem energia média (nível 2): serve para quem tem tempo médio ou muito, mas não para quem tem pouco.'],
    ['Crianças', 'Se há crianças em casa, o animal precisa conviver bem com elas.',
      'Thor não convive bem com crianças, então não é indicado para a Carla.'],
    ['Outros animais', 'Se há outros animais em casa, o animal precisa conviver bem com eles.',
      'Rex não convive bem com outros animais, então não é indicado para o Bruno, que já tem animais.'],
    ['Alergia', 'Quem tem alergia a pelos só pode receber um animal hipoalergênico.',
      'Para o Diego, que é alérgico, só Thor e Luna são hipoalergênicos.'],
    ['Experiência', 'Quem nunca teve animais não recebe um animal de energia alta.',
      'Para o Diego, que seria o primeiro tutor, Rex, Mimi e Bob ficam de fora.'],
    ['Vacinação', 'O animal precisa estar vacinado.',
      'Bob ainda não foi vacinado, então não é indicado para ninguém por enquanto.']
  ];
  const niveis = [
    ['1', 'apartamento', 'pequeno', 'pouco', 'baixa'],
    ['2', 'casa pequena', 'médio', 'médio', 'média'],
    ['3', 'casa com quintal', 'grande', 'muito', 'alta']
  ];
  alvo.append(
    h('h2', {}, 'Como o sistema decide'),
    h('p', { class: 'texto' },
      'Cada animal é conferido contra o seu perfil por 7 regras. Se passar em todas, ele é indicado. ' +
      'Se falhar em alguma, o site diz exatamente qual, e é isso que aparece no checklist da busca e na aba "Por que não?".'),
    h('div', { class: 'regras-grade' }, regras.map(([titulo, texto, exemplo], i) =>
      h('article', { class: 'regra' },
        h('span', { class: 'num' }, String(i + 1)),
        h('h3', {}, titulo), h('p', {}, texto), h('p', { class: 'ex' }, exemplo)))),
    h('h2', { class: 'sec' }, 'Os níveis'),
    h('p', { class: 'texto' }, 'As regras de espaço e de tempo livre comparam números: quanto maior o nível, mais a casa ou a pessoa oferece.'),
    h('div', { class: 'tabela-wrap' }, h('table', { class: 'niveis' },
      h('thead', {}, h('tr', {}, ['Nível', 'Moradia', 'Porte do animal', 'Tempo livre', 'Energia do animal'].map(c => h('th', {}, c)))),
      h('tbody', {}, niveis.map(l => h('tr', {}, l.map(c => h('td', {}, c))))))),
    h('div', { class: 'final' },
      h('strong', {}, 'Resultado final: '),
      'um animal é indicado quando passa nas 7 regras ao mesmo tempo. Basta uma falhar para ele não ser indicado.'));
}

// ---------- Animais do abrigo ----------
async function montarAbrigo(alvo) {
  try { alvo.append(h('h2', {}, 'Animais do abrigo'), grade(await api('/api/animais'))); }
  catch (e) { alvo.append(erro(e)); }
}

// ---------- Perfis cadastrados ----------
async function montarPerfis(alvo) {
  try {
    const pessoas = await api('/api/pessoas');
    alvo.append(h('h2', {}, 'Perfis cadastrados'));
    for (const p of pessoas) {
      const [rec, duplas] = await Promise.all([
        api(`/api/pessoas/${p.nome}/recomendados`), api(`/api/pessoas/${p.nome}/duplas`)]);
      alvo.append(h('article', { class: 'perfil' },
        h('h3', {}, p.nome),
        h('p', {}, `Mora em ${bonito(p.moradia)}, ${p.criancas ? 'com' : 'sem'} crianças, ` +
          `${p.animais ? 'com' : 'sem'} outros animais, tempo livre ${p.tempo}.` +
          (p.alergico ? ' Tem alergia a pelos.' : '') + (p.iniciante ? ' Nunca teve animais.' : '')),
        h('p', {}, h('span', { class: 'rotulo' }, 'Recomendados: '), lista(rec.map(a => a.nome))),
        h('p', {}, h('span', { class: 'rotulo' }, 'Podem ser adotados juntos: '),
          duplas.length ? duplas.map(d => `${d.primeiro} e ${d.segundo}`).join('; ') : 'nenhuma dupla')));
    }
  } catch (e) { alvo.append(erro(e)); }
}

// ---------- Prioridade e saúde ----------
async function montarDestaques(alvo) {
  try {
    const [prio, saude] = await Promise.all([api('/api/animais/prioritarios'), api('/api/animais/saude')]);
    alvo.append(h('div', { class: 'duas' },
      h('div', {}, h('h2', {}, 'Prioridade de adoção (idosos)'), grade(prio)),
      h('div', {}, h('h2', {}, 'Precisam de atenção de saúde'),
        saude.length ? grade(saude) : h('p', { class: 'vazio' }, 'Nenhum animal precisa de atenção no momento.'))));
  } catch (e) { alvo.append(erro(e)); }
}

// ---------- Por que não? ----------
async function montarExplicar(alvo) {
  try {
    const [pessoas, animais] = await Promise.all([api('/api/pessoas'), api('/api/animais')]);
    const resposta = h('div', { 'aria-live': 'polite' });
    const form = h('form', { class: 'painel' },
      campo('Para qual pessoa?', 'pessoa', pessoas.map(p => [p.nome, p.nome])),
      campo('Sobre qual animal?', 'animal', animais.map(a => [a.nome, a.nome])),
      h('div', { class: 'acoes' }, h('button', { class: 'acao', type: 'submit' }, 'Explicar')));
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(form));
      try {
        const x = await api(`/api/explicar?animal=${d.animal}&pessoa=${d.pessoa}`);
        resposta.replaceChildren(h('div', { class: 'resposta' + (x.recomendado ? '' : ' recusa') },
          h('strong', {}, x.mensagem),
          x.motivos.length ? h('ul', {}, x.motivos.map(m => h('li', {}, m))) : null));
      } catch (e) { resposta.replaceChildren(erro(e)); }
    });
    alvo.append(form, resposta);
  } catch (e) { alvo.append(erro(e)); }
}

// ---------- Exemplos ----------
async function montarExemplos(alvo) {
  try {
    const exemplos = await api('/api/exemplos');
    alvo.append(h('h2', {}, 'Consultas de exemplo'),
      ...exemplos.map((x, i) => h('article', { class: 'exemplo' },
        h('h3', {}, `${i + 1}. ${x.pergunta}`),
        x.resultado.map(l => h('p', {}, l.trim())))));
  } catch (e) { alvo.append(erro(e)); }
}

// ---------- abas ----------
const montadores = {
  buscar: montarBuscar, comofunciona: montarComoFunciona, abrigo: montarAbrigo, perfis: montarPerfis,
  destaques: montarDestaques, explicar: montarExplicar, exemplos: montarExemplos
};
const montadas = new Set();

function abrir(id) {
  document.querySelectorAll('nav [role=tab]').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.alvo === id)));
  document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== id; });
  if (!montadas.has(id)) { montadas.add(id); montadores[id](document.getElementById(id)); }
}
document.querySelectorAll('nav [role=tab]').forEach(b => b.addEventListener('click', () => abrir(b.dataset.alvo)));
abrir('buscar');
